[project]
name = "orion"
version = "0.1.0"
description = "信息监控系统"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/core", "src/plugins", "src/api", "src/persistence", "src/bootstrap.py"]
sources = ["src"]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
# 核心六个模块开 strict；report 的 strict 状态待定
strict = [
    "src/core/target",
    "src/core/collector",
    "src/core/event",
    "src/core/condition_engine",
    "src/core/operators",
    "src/core/hil",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["core", "plugins", "api", "persistence"]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "core 不依赖外层（api / persistence / plugins）"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["api", "persistence", "plugins"]

[[tool.importlinter.contracts]]
name = "api 与 persistence 互不 import"
type = "independence"
modules = ["api", "persistence"]


# ---- core 模块之间的依赖（接口定义在依赖方，数据定义在所属模块）
#   最底层：target、hil、report —— 不依赖其他 core 模块
#   collector、condition_engine → target
#   operators → target、condition_engine、hil（Occasion 引用 ObservationEnvelope / EvalResult，上下文引用 Suggestion）
#   event     → target、condition_engine、operators、report（不依赖 collector / hil）

[[tool.importlinter.contracts]]
name = "target 零依赖"
type = "forbidden"
source_modules = ["core.target"]
forbidden_modules = [
    "core.collector", "core.event", "core.condition_engine",
    "core.operators", "core.hil", "core.report",
]

[[tool.importlinter.contracts]]
name = "condition_engine 只依赖 target（ObservationEnvelope）"
type = "forbidden"
source_modules = ["core.condition_engine"]
forbidden_modules = [
    "core.collector", "core.event",
    "core.operators", "core.hil", "core.report",
]

[[tool.importlinter.contracts]]
name = "hil 零依赖（白名单动作由 bootstrap 注入）"
type = "forbidden"
source_modules = ["core.hil"]
forbidden_modules = [
    "core.target", "core.collector", "core.event",
    "core.condition_engine", "core.operators", "core.report",
]

[[tool.importlinter.contracts]]
name = "report 零依赖"
type = "forbidden"
source_modules = ["core.report"]
forbidden_modules = [
    "core.target", "core.collector", "core.event",
    "core.condition_engine", "core.operators", "core.hil",
]

[[tool.importlinter.contracts]]
name = "collector 只依赖 target"
type = "forbidden"
source_modules = ["core.collector"]
forbidden_modules = [
    "core.event", "core.condition_engine",
    "core.operators", "core.hil", "core.report",
]

[[tool.importlinter.contracts]]
name = "operators 只依赖 target / condition_engine / hil"
type = "forbidden"
source_modules = ["core.operators"]
forbidden_modules = ["core.collector", "core.event", "core.report"]

[[tool.importlinter.contracts]]
name = "event 不直接依赖 collector / hil（数据由可观测目标 publish 给 runner，建议经 SuggestionSink 流出）"
type = "forbidden"
source_modules = ["core.event"]
forbidden_modules = ["core.collector", "core.hil"]
# 经 operators 间接到 hil（Suggestion 定义在 hil）是允许的；只禁止 event 直接 import
allow_indirect_imports = "True"

# ---- 插件只经扩展点和注入的依赖做事，不直接碰监控运行状态的管理者
#   算子改子事件只能经上下文（ctx.event）；父事件 / 目标只能提建议（ctx.propose）。
#   对外输出（如 core.report）由 bootstrap 构造时注入，允许依赖。

[[tool.importlinter.contracts]]
name = "插件不依赖 event / api / persistence"
type = "forbidden"
source_modules = ["plugins"]
forbidden_modules = ["core.event", "api", "persistence"]
